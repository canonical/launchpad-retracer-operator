server {
    server_name _;
    listen 80 default_server;
    listen [::]:80 default_server;

    root /srv/retracers;

    absolute_redirect off;

    # The database lives outside of the published directory, which
    # crash-digger recreates on every run, but is still served from it.
    location = /apport-duplicates/apport_duplicates.db {
        alias /srv/retracers/apport_duplicates.db;
    }

    location / {
        autoindex on;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
